[package]
name = "anno1800-cardforge"
version = "1.0.0"
description = "Windows item editor for Anno 1800"
authors = ["hk9992221"]
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
quick-xml = "0.38"
roxmltree = "0.21"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "dds"] }
ddsfile = "0.5"
image_dds = { version = "0.7", default-features = false, features = ["ddsfile"] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
