name: Windows Setup and Portable
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check repository contents
        shell: pwsh
        run: |
          $excluded = git ls-files | Where-Object { $_ -match '(^|/)(test|tests|__tests__)(/|$)|(^|/)[^/]*(SPEC|\.test\.|\.spec\.)' }
          if ($excluded) { throw "Private specification or local checks must stay outside the repository: $excluded" }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Build Windows installation package
        run: npm run tauri -- build --bundles nsis
      - name: Prepare Setup and Portable
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $publishRoot = Join-Path $PWD 'release-output'
          $portableRoot = Join-Path $publishRoot 'Anno1800-CardForge'
          New-Item -ItemType Directory -Force $portableRoot | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not generated' }
          Copy-Item $installer.FullName (Join-Path $publishRoot "Anno1800-CardForge-$version-Setup.exe")
          Copy-Item src-tauri/target/release/anno1800-cardforge.exe (Join-Path $portableRoot 'Anno1800-CardForge.exe')
          Set-Content (Join-Path $portableRoot 'portable.flag') 'Portable data is stored in CardForgeData next to the application.'
          @'
          Anno 1800 卡牌工坊 · Portable

          双击 Anno1800-CardForge.exe 运行，无需安装。
          草稿、资源缓存与备份保存在旁边的 CardForgeData 中。
          请保留 portable.flag，移动时将整个文件夹一起移动。
          需要 Windows 10/11 x64 和 Microsoft Edge WebView2 运行时。
          '@ | Set-Content (Join-Path $portableRoot '开始使用.txt') -Encoding utf8
          Compress-Archive -Path $portableRoot -DestinationPath (Join-Path $publishRoot "Anno1800-CardForge-$version-Portable.zip")
          Get-ChildItem $publishRoot -File | Where-Object { $_.Extension -in '.exe','.zip' } | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)"
          } | Set-Content (Join-Path $publishRoot 'SHA256SUMS.txt') -Encoding ascii
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v4
        with:
          name: Anno1800-CardForge-${{ env.APP_VERSION }}-Windows
          path: |
            release-output/*-Setup.exe
            release-output/*-Portable.zip
            release-output/SHA256SUMS.txt
      - name: Publish release downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; keeping its original files. The current build is available in workflow artifacts."
            exit 0
          }
          @'
          Anno 1800 卡牌工坊 Windows 版。

          - Setup.exe：安装版，提供开始菜单入口。
          - Portable.zip：便携版，解压运行，数据保存在程序旁。

          支持生产卡牌、市政厅卡牌、船舶与飞艇卡牌；包含效果积木、批量制作、图片裁剪、Mod 导入和固定名称导出。
          使用方法见仓库首页。具体卡牌效果和获取行为请在自己的游戏环境中验证。
          '@ | Set-Content release-notes.txt -Encoding utf8
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Anno1800 CardForge $tag" --notes-file release-notes.txt --latest release-output/*-Setup.exe release-output/*-Portable.zip release-output/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
